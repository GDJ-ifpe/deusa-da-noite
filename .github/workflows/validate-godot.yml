name: Validate Godot project

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Godot
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${GODOT_VERSION}" \
            --output /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          mv \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            /tmp/godot/godot

          chmod +x /tmp/godot/godot
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Show Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --path game --import

      - name: Run smoke test
        run: godot --headless --path game --quit-after 1